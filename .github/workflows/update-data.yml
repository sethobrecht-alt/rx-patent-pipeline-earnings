name: Update patent data and deploy

on:
  schedule:
    - cron: "0 9 25 * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/curated_overrides.json"
      - "scripts/curated_pipeline.json"
      - "scripts/curated_earnings.json"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Run LOE tracker data pipeline
        run: python scripts/build_data.py
      - name: Run specialty pipeline data pipeline
        run: python scripts/build_pipeline_data.py
      - name: Run earnings tracker data pipeline
        run: python scripts/build_earnings_data.py
      - name: Commit updated data (if changed)
        run: |
          git config user.name "rx-patent-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/drugs.json site/data/pipeline.json site/data/earnings.json
          git diff --cached --quiet && echo "No data changes." || git commit -m "chore: automated data refresh"
          git push
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
